name: AIOS Daily Forex Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

jobs:
  daily-forex-orchestrator:
    name: Daily Forex Orchestrator
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run AIOS daily Forex orchestrator
        shell: pwsh
        env:
          AIOS_REPO_ROOT: ${{ github.workspace }}
        run: |
          pwsh -NoProfile -File scripts/forex_delivery/Invoke-AiOsDailyForexOrchestrator.ps1 -ReportDirectory "$env:RUNNER_TEMP/aios_daily_forex_orchestrator"

      - name: Upload daily orchestrator artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aios-daily-forex-orchestrator
          path: ${{ runner.temp }}/aios_daily_forex_orchestrator
          if-no-files-found: warn
