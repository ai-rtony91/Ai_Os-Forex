name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check required governance files
        shell: bash
        run: |
          set -euo pipefail
          test -f SECURITY.md
          test -f COMPLIANCE_BASELINE.md
          test -f LICENSE
          test -f .github/dependabot.yml
          test -f docs/security/threat-model.md
          test -f docs/security/approval-model.md
          test -f docs/security/audit-logging.md
          test -f docs/security/secret-prevention.md
          test -f docs/security/repo-hygiene.md

      - name: Check workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/ci.yml
          grep -q "name: CI" .github/workflows/ci.yml
          grep -q "runs-on: ubuntu-latest" .github/workflows/ci.yml

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter '*.ps1' | Sort-Object FullName

          if (-not $files) {
            Write-Host "No PowerShell scripts found."
            return
          }

          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref] $tokens, [ref] $errors)

            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $errors) {
                Write-Host ("{0}:{1}:{2}: {3}" -f $file.FullName, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message)
              }
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Check placeholder identity strings in source files
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "youremail@example.com|your-github-email" \
            --include="*.py" \
            --include="*.ps1" \
            --include="*.json" \
            --include="*.yml" \
            --include="*.yaml" \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=tests \
            .; then
            echo "Placeholder identity string found in source/config files."
            exit 1
          fi

      - name: Check obvious secret assignments in source files
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInP "\b(api_key|apikey|secret|token|password|broker)\b[[:space:]]*[:=]\s*['\"](?!BLOCKED|NONE|MISSING|EXAMPLE|placeholder|changeme|your_|demo_)[^'\"]+['\"]" \
            --include="*.py" \
            --include="*.ps1" \
            --include="*.json" \
            --include="*.yml" \
            --include="*.yaml" \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=docs \
            --exclude-dir=tests \
            .; then
            echo "Potential secret-like assignment found in source/config files."
            exit 1
          fi

      - name: Install research workflow test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check project test collection and package imports
        run: python -m pytest --collect-only -q

      - name: Test Forex-first research controller and watchdog
        run: |
          python -m pytest \
            tests/orchestration/test_aios_research_campaign.py \
            tests/orchestration/test_aios_research_campaign_runner.py \
            tests/orchestration/test_aios_deadman_watchdog_campaign_health.py \
            tests/orchestration/test_aios_research_campaign_end_to_end.py \
            tests/orchestration/test_aios_autonomous_forex_research_pipeline.py -q

      - name: Python syntax check for core source
        shell: bash
        run: |
          set -euo pipefail
          paths=""
          for dir in aios agent services apps scripts automation; do
            if test -d "$dir"; then
              paths="$paths $dir"
            fi
          done

          if test -n "$paths"; then
            python -m compileall $paths
          else
            echo "No core Python source directories found."
          fi

  windows-research-guards:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install research workflow test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Verify Windows PowerShell is available
        shell: pwsh
        run: |
          $null = Get-Command powershell -ErrorAction Stop

      - name: Give the checked-out test commit a local branch name
        shell: pwsh
        run: |
          git switch -c ci/research-guards
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test PowerShell research runner and heartbeat guards
        shell: pwsh
        run: |
          python -m pytest tests/orchestration/test_aios_autonomous_forex_research_runner.py tests/orchestration/test_runtime_heartbeat_refresh.py tests/orchestration/test_heartbeat_dirty_write_guard.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
