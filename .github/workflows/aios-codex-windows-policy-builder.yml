      },
      "steps": [
        {
          "run": "git config --global core.autocrlf false\nif ($LASTEXITCODE -ne 0) { throw 'Could not preserve reviewed LF source bytes' }",
          "name": "Preserve reviewed LF source bytes"
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "path": "aios",
            "fetch-depth": 1,
            "persist-credentials": false
          },
          "name": "Check out approved AIOS branch"
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "01fc69f4026735edfdf6789820549727a4867b11",
            "fetch-depth": 1,
            "path": "codex",
            "repository": "openai/codex",
            "persist-credentials": false
          },
          "name": "Check out exact upstream source"
        },
        {
          "run": "$ErrorActionPreference = 'Stop'\n$PSNativeCommandUseErrorActionPreference = $false\nSet-StrictMode -Version Latest\n$evidence = Join-Path $env:RUNNER_TEMP 'aios-codex-policy-evidence'\nNew-Item -ItemType Directory -Path $evidence -Force | Out-Null\n$upstream = Join-Path $env:GITHUB_WORKSPACE 'codex'\n$aios = Join-Path $env:GITHUB_WORKSPACE 'aios'\n$toolchain = '1.95.0-x86_64-pc-windows-msvc'\n$target = 'x86_64-pc-windows-msvc'\n$base = '01fc69f4026735edfdf6789820549727a4867b11'\n$patch = Join-Path $aios 'tools/vendor/codex-windows-policy-remedy-rust-v0.159.3.patch'\n$receipt = [ordered]@{\n  packet = 'PKT-EAST-WINDOWS-CODEX-BUILDER-20261018'\n  aios_commit = $env:GITHUB_SHA\n  ref = $env:GITHUB_REF\n  event = $env:GITHUB_EVENT_NAME\n  run_id = $env:GITHUB_RUN_ID\n  run_attempt = $env:GITHUB_RUN_ATTEMPT\n  run_url = \"https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID\"\n  image_os = $env:ImageOS\n  image_version = $env:ImageVersion\n  required_upstream_commit = $base\n  required_toolchain = $toolchain\n  required_target = $target\n  candidate_executed = $false\n  runtime_activation = $false\n  tests = @()\n  status = 'STARTED'\n}\nfunction Save-Receipt {\n  $receipt | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $evidence 'receipt.json') -Encoding utf8NoBOM\n}\nfunction Invoke-Logged {\n  param([string]$Name, [string]$Command, [string[]]$Arguments)\n  $log = Join-Path $evidence \"$Name.log\"\n  \"Command: $Command $($Arguments -join ' ')\" | Set-Content -LiteralPath $log -Encoding utf8NoBOM\n  & $Command @Arguments 2>&1 | Tee-Object -FilePath $log -Append | ForEach-Object { Write-Host $_ }\n  $exit = $LASTEXITCODE\n  \"Exit: $exit\" | Add-Content -LiteralPath $log -Encoding utf8NoBOM\n  if ($exit -ne 0) { throw \"$Name failed with exit $exit; see retained log\" }\n}\nfunction Get-GitLines {\n  param([string[]]$Arguments)\n  $output = @(& git -C $upstream @Arguments)\n  if ($LASTEXITCODE -ne 0) { throw \"Git read/check failed: $($Arguments -join ' ')\" }\n  return $output\n}\nfunction Assert-Paths {\n  $actual = @(Get-GitLines @('diff', '--name-only') | Sort-Object)\n  $expected = @($sourcePins.path | Sort-Object)\n  if (($actual -join \"`n\") -cne ($expected -join \"`n\")) { throw 'Changed upstream paths differ from the reviewed paths' }\n  $actual | Set-Content -LiteralPath (Join-Path $evidence 'changed-paths.txt') -Encoding utf8NoBOM\n  $untracked = @(Get-GitLines @('ls-files', '--others', '--exclude-standard'))\n  if ($untracked.Count -ne 0) { throw 'Unexpected untracked upstream source files' }\n  foreach ($pin in $sourcePins) {\n    $actualHash = (Get-FileHash -LiteralPath (Join-Path $upstream $pin.path) -Algorithm SHA256).Hash.ToLowerInvariant()\n    if ($actualHash -cne $pin.after) { throw \"Reviewed candidate hash mismatch: $($pin.path)\" }\n  }\n}\n# Replaced by the preparation script from the hash-verified review manifest.\n$sourcePins = @('[{\"path\":\"codex-rs/core/src/codex_thread.rs\",\"before\":\"1d3c5b62bd86aba13362d73aadb2221bbb5362619f690c311ac69d4b31e29aa0\",\"after\":\"427415480e148892958c03fe5d9c917e7ebe70199ea4d6209ff373f56792d4dc\"},{\"path\":\"codex-rs/codex-mcp/src/binding.rs\",\"before\":\"3b9f48ce4f861f979b465fb8ce4c3ef25a0ca0c2aa57d0a8b85429eb298a4ac8\",\"after\":\"a48bd7268c6eca249c33e5391ee685fa23a6155efb8b018fa6b0fcf985c1c641\"},{\"path\":\"codex-rs/app-server/tests/suite/v2/plugin_install.rs\",\"before\":\"0c02fd89c5cf353f8ca2f2673f515c8af28c2651c4e934882ce518c804729459\",\"after\":\"a9857bbf3f0afdc60259383557d1100ea20fb8090bc5acbe3acaaade7fb7ea8b\"},{\"path\":\"codex-rs/Cargo.lock\",\"before\":\"4fab6fe99180e2b8f305bd4b33c1b4bd825e3fa4cdef1045be750843bd3d431e\",\"after\":\"d7918248638c0477183a6437f07435c19fecc6ec85b6ea57a97e50301e9e39a9\"}]' | ConvertFrom-Json)\n$testGroups = @('[{\"id\":\"core\",\"package\":\"codex-core\",\"lib\":true,\"filter\":\"direct_call_sandbox_state_\",\"expected\":[\"direct_call_sandbox_state_meta_tests::producer_state_overwrites_caller_value_preserving_other_metadata\",\"direct_call_sandbox_state_meta_tests::non_object_metadata_is_rejected_even_with_producer_state\",\"direct_call_sandbox_state_meta_tests::unsupported_producer_cannot_forward_a_caller_state\",\"direct_call_sandbox_state_meta_tests::non_opted_in_metadata_without_state_is_preserved\",\"direct_call_sandbox_state_thread_integration_tests::direct_call_sandbox_state_missing_exact_cwd_rejects_before_real_transport\",\"direct_call_sandbox_state_thread_integration_tests::direct_call_sandbox_state_same_config_fresh_connections_rejects_real_inflight_result\",\"direct_call_sandbox_state_thread_integration_tests::direct_call_sandbox_state_real_prepared_timeout_uses_shorter_bound\",\"direct_call_sandbox_state_thread_integration_tests::direct_call_sandbox_state_publication_changes_during_target_capture_before_wire\"]},{\"id\":\"binding-authority\",\"package\":\"codex-mcp\",\"lib\":true,\"filter\":\"direct_call_authority_tests\",\"expected\":[\"direct_call_authority_tests::same_config_arc_with_new_connections_is_not_current_authority\",\"direct_call_authority_tests::same_connections_with_new_config_is_not_current_authority\"]},{\"id\":\"binding-wire\",\"package\":\"codex-mcp\",\"lib\":true,\"filter\":\"direct_call_sandbox_state_\",\"expected\":[\"direct_call_sandbox_state_catalog_wire_tests::direct_call_sandbox_state_catalog_invalidated_rejects_real_wire_and_read\",\"direct_call_sandbox_state_catalog_wire_tests::direct_call_sandbox_state_closed_captured_client_cannot_dispatch_again\"]},{\"id\":\"public\",\"package\":\"codex-app-server\",\"lib\":false,\"filter\":\"direct_call_sandbox_state_\",\"expected\":[\"direct_call_sandbox_state_integration::direct_call_sandbox_state_advertised_wire_is_typed_and_thread_bound\",\"direct_call_sandbox_state_integration::direct_call_sandbox_state_replaces_fabricated_state_and_preserves_input\",\"direct_call_sandbox_state_integration::direct_call_sandbox_state_opt_out_preserves_raw_and_rejects_reserved\",\"direct_call_sandbox_state_integration::direct_call_sandbox_state_rejects_nonobject_wire_metadata_before_transport\",\"direct_call_sandbox_state_integration::direct_call_sandbox_state_unadvertised_raw_and_app_only_have_no_export\",\"direct_call_sandbox_state_integration::direct_call_sandbox_state_unknown_and_filtered_tools_do_not_dispatch\",\"direct_call_sandbox_state_integration::direct_call_sandbox_state_target_catalog_error_does_not_dispatch\",\"direct_call_sandbox_state_integration::direct_call_sandbox_state_strips_entitlements_on_captured_and_raw_routes\",\"direct_call_sandbox_state_integration::direct_call_sandbox_state_target_only_does_not_wait_for_pending_optional_server\",\"direct_call_sandbox_state_integration::direct_call_sandbox_state_configured_timeout_bounds_real_transport\",\"direct_call_sandbox_state_integration::direct_call_sandbox_state_refresh_uses_new_configured_server\"]}]' | ConvertFrom-Json)\ntry {\n  Save-Receipt\n  $aiosHead = (& git -C $aios rev-parse HEAD)\n  if ($LASTEXITCODE -ne 0 -or $aiosHead -cne $env:GITHUB_SHA) { throw 'AIOS checkout differs from the exact triggering commit' }\n  $receipt.aios_checkout_commit = $aiosHead\n  $head = (Get-GitLines @('rev-parse', 'HEAD')) -join ''\n  if ($head -cne $base) { throw 'Upstream commit differs from the approved pin' }\n  if (@(Get-GitLines @('status', '--porcelain')).Count -ne 0) { throw 'Upstream checkout is not initially clean' }\n  $receipt.upstream_commit = $head\n  $patchHash = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()\n  if ($patchHash -cne '4addc44b7683dd7b2729dab04551c501ff8e0ae52616b8aa9d3f00d0ad6828a3') { throw 'Reviewed patch hash mismatch' }\n  $receipt.patch_sha256 = $patchHash\n  foreach ($pin in $sourcePins) {\n    $actualHash = (Get-FileHash -LiteralPath (Join-Path $upstream $pin.path) -Algorithm SHA256).Hash.ToLowerInvariant()\n    if ($actualHash -cne $pin.before) { throw \"Reviewed before-source hash mismatch: $($pin.path)\" }\n  }\n  Invoke-Logged 'patch-numstat' 'git' @('-C', $upstream, 'apply', '--numstat', $patch)\n  # The byte-pinned reviewed candidates each retain one extra blank line at EOF.\n  # Keep those bytes; every other Git whitespace check remains enabled.\n  Invoke-Logged 'patch-check' 'git' @('-C', $upstream, '-c', 'core.whitespace=-blank-at-eof', 'apply', '--check', '--whitespace=error', $patch)\n  Invoke-Logged 'patch-apply' 'git' @('-C', $upstream, '-c', 'core.whitespace=-blank-at-eof', 'apply', '--whitespace=error', $patch)\n  # Exact owner-reviewed local package identity reconciliation; external records unchanged.\n  $identityPatch = Join-Path $env:RUNNER_TEMP 'aios-local-package-identity.patch'\n  [IO.File]::WriteAllBytes($identityPatch, [Convert]::FromBase64String(''))\n  $identityPatchHash = (Get-FileHash -LiteralPath $identityPatch -Algorithm SHA256).Hash.ToLowerInvariant()\n  if ($identityPatchHash -cne 'f82b2a59a373de8f84c5b2a8bf1e97f02de2f0f0e07be45be7dccacd6eb0e004') { throw 'Reviewed lock identity patch hash mismatch' }\n  $receipt.lock_identity_exception = @{path = 'codex-rs/Cargo.lock'; before_sha256 = '4fab6fe99180e2b8f305bd4b33c1b4bd825e3fa4cdef1045be750843bd3d431e'; after_sha256 = 'd7918248638c0477183a6437f07435c19fecc6ec85b6ea57a97e50301e9e39a9'; identity_patch_sha256 = $identityPatchHash; local_package_versions = 159; preserved_external_package_records = 1313; manifests_changed = $false; third_party_dependency_refresh = $false}\n  Save-Receipt\n  Invoke-Logged 'lock-identity-check' 'git' @('-C', $upstream, 'apply', '--check', '--whitespace=error', $identityPatch)\n  Invoke-Logged 'lock-identity-apply' 'git' @('-C', $upstream, 'apply', '--whitespace=error', $identityPatch)\n\n  Assert-Paths\n  Invoke-Logged 'source-diff-check' 'git' @('-C', $upstream, '-c', 'core.whitespace=-blank-at-eof', 'diff', '--check')\n  Invoke-Logged 'source-diff' 'git' @('-C', $upstream, 'diff', '--no-ext-diff', '--no-color')\n  $receipt.source_pins = $sourcePins\n  $receipt.reviewed_eof_blank_line_preservation = 'Exactly reviewed candidate hashes required; blank-at-eof disabled only for their retained EOF blank lines'\n  $lockPaths = @(Get-GitLines @('ls-files', '*Cargo.lock'))\n  if ($lockPaths.Count -eq 0 -or $lockPaths -notcontains 'codex-rs/Cargo.lock') { throw 'Pinned upstream Cargo.lock missing' }\n  $lockHashes = @{}\n  foreach ($lockPath in $lockPaths) {\n    $lockHashes[$lockPath] = (Get-FileHash -LiteralPath (Join-Path $upstream $lockPath) -Algorithm SHA256).Hash.ToLowerInvariant()\n  }\n  $receipt.lockfile_hashes_before = $lockHashes\n  Save-Receipt\n\n  $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'\n  if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'vswhere is unavailable' }\n  $vs = @(& $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)\n  if ($LASTEXITCODE -ne 0 -or $vs.Count -ne 1 -or [string]::IsNullOrWhiteSpace($vs[0])) { throw 'Qualified VS2022 x64 MSVC installation not found' }\n  $vsRoot = $vs[0].Trim()\n  $launchShell = Join-Path $vsRoot 'Common7/Tools/Launch-VsDevShell.ps1'\n  if (-not (Test-Path -LiteralPath $launchShell -PathType Leaf)) { throw 'VS2022 developer PowerShell launcher is missing' }\n  & $launchShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation\n  $ambientCl = @(Get-Command cl.exe -CommandType Application -All -ErrorAction SilentlyContinue | ForEach-Object Source)\n  $ambientLink = @(Get-Command link.exe -CommandType Application -All -ErrorAction SilentlyContinue | ForEach-Object Source)\n  $receipt.compiler_resolution = @{selected_visual_studio = $vsRoot; developer_toolset = $env:VCToolsInstallDir; ambient_cl_paths = $ambientCl; ambient_link_paths = $ambientLink}\n  Save-Receipt\n  if ([string]::IsNullOrWhiteSpace($env:VCToolsInstallDir)) { throw 'Selected developer shell did not identify its MSVC toolset' }\n  $vsPrefix = [IO.Path]::GetFullPath($vsRoot).TrimEnd('\\') + '\\'\n  $toolsetRoot = [IO.Path]::GetFullPath($env:VCToolsInstallDir)\n  if (-not $toolsetRoot.StartsWith($vsPrefix, [StringComparison]::OrdinalIgnoreCase)) { throw 'Developer toolset is outside the selected VS2022 installation' }\n  $qualifiedBin = Join-Path $toolsetRoot 'bin/Hostx64/x64'\n  $cl = [IO.Path]::GetFullPath((Join-Path $qualifiedBin 'cl.exe'))\n  $link = [IO.Path]::GetFullPath((Join-Path $qualifiedBin 'link.exe'))\n  $receipt.compiler_resolution.qualified_cl = $cl\n  $receipt.compiler_resolution.qualified_link = $link\n  Save-Receipt\n  foreach ($compiler in @($cl, $link)) {\n    if (-not $compiler.StartsWith($vsPrefix, [StringComparison]::OrdinalIgnoreCase) -or $compiler -notmatch 'Hostx64[\\\\/]x64[\\\\/]' -or -not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Compiler/linker does not match selected VS2022 host/target x64' }\n  }\n  $env:PATH = $qualifiedBin + [IO.Path]::PathSeparator + $env:PATH\n  $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = $link\n  if ([string]::IsNullOrWhiteSpace($env:WindowsSdkDir) -or [string]::IsNullOrWhiteSpace($env:WindowsSDKVersion)) { throw 'Windows SDK environment unavailable' }\n  $sdkVersion = $env:WindowsSDKVersion.TrimEnd('\\')\n  $sdkPaths = @(\n    (Join-Path $env:WindowsSdkDir \"Include/$sdkVersion/um/Windows.h\"),\n    (Join-Path $env:WindowsSdkDir \"Lib/$sdkVersion/um/x64/kernel32.lib\"),\n    (Join-Path $env:WindowsSdkDir \"Lib/$sdkVersion/ucrt/x64/ucrt.lib\")\n  )\n  foreach ($sdkPath in $sdkPaths) { if (-not (Test-Path -LiteralPath $sdkPath -PathType Leaf)) { throw \"Selected Windows SDK input missing: $sdkPath\" } }\n  $clOutput = @(& $cl 2>&1)\n  $clExit = $LASTEXITCODE\n  $clOutput | Set-Content -LiteralPath (Join-Path $evidence 'cl-version.log') -Encoding utf8NoBOM\n  \"Exit: $clExit\" | Add-Content -LiteralPath (Join-Path $evidence 'cl-version.log') -Encoding utf8NoBOM\n  if ($clExit -notin @(0, 2) -or ($clOutput -join \"`n\") -notmatch 'C/C\\+\\+.*Compiler Version.*for x64') { throw 'MSVC compiler banner is not qualified' }\n  $linkIdentity = [ordered]@{path = $link; file_version = (Get-Item -LiteralPath $link).VersionInfo.FileVersion; sha256 = (Get-FileHash -LiteralPath $link -Algorithm SHA256).Hash.ToLowerInvariant()}\n  if ([string]::IsNullOrWhiteSpace($linkIdentity.file_version)) { throw 'Qualified linker has no readable PE version metadata' }\n  $linkIdentity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'link-version.json') -Encoding utf8NoBOM\n  $receipt.compiler = @{visual_studio = $vsRoot; cl = $cl; cl_sha256 = (Get-FileHash $cl -Algorithm SHA256).Hash.ToLowerInvariant(); cl_file_version = (Get-Item $cl).VersionInfo.FileVersion; cl_probe_exit = $clExit; link = $link; link_sha256 = (Get-FileHash $link -Algorithm SHA256).Hash.ToLowerInvariant(); link_file_version = (Get-Item $link).VersionInfo.FileVersion; sdk_root = $env:WindowsSdkDir; sdk_version = $sdkVersion; sdk_input_paths = $sdkPaths}\n  Save-Receipt\n\n  Invoke-Logged 'rustup-install' 'rustup' @('toolchain', 'install', $toolchain, '--profile', 'minimal', '--no-self-update')\n  $env:RUSTUP_TOOLCHAIN = $toolchain\n  $env:CARGO_TERM_COLOR = 'never'\n  Invoke-Logged 'rustc-version' 'rustc' @(\"+$toolchain\", '-Vv')\n  Invoke-Logged 'cargo-version' 'cargo' @(\"+$toolchain\", '-V')\n  $rustVersion = Get-Content -LiteralPath (Join-Path $evidence 'rustc-version.log') -Raw\n  $cargoVersion = Get-Content -LiteralPath (Join-Path $evidence 'cargo-version.log') -Raw\n  if ($rustVersion -notmatch '(?m)^release: 1\\.95\\.0\\r?$' -or $rustVersion -notmatch '(?m)^host: x86_64-pc-windows-msvc\\r?$' -or $cargoVersion -notmatch '(?m)^cargo 1\\.95\\.0 ') { throw 'Actual Rust/Cargo identity differs from required toolchain' }\n  $receipt.rustc_version = $rustVersion\n  $receipt.cargo_version = $cargoVersion\n  Set-Location (Join-Path $upstream 'codex-rs')\n  foreach ($group in $testGroups) {\n    $args = @(\"+$toolchain\", 'test', '--locked', '-p', $group.package)\n    if ($group.lib) { $args += '--lib' }\n    $args += $group.filter\n    Invoke-Logged \"$($group.id)-list\" 'cargo' ($args + @('--', '--list'))\n    $list = Get-Content -LiteralPath (Join-Path $evidence \"$($group.id)-list.log\") -Raw\n    $names = @([regex]::Matches($list, '(?m)^([^\\s]+): test\\r?$') | ForEach-Object { $_.Groups[1].Value })\n    if ($names.Count -ne $group.expected.Count -or $names.Count -eq 0) { throw \"Focused test discovery count differs from reviewed source: $($group.id)\" }\n    foreach ($expected in $group.expected) {\n      if (@($names | Where-Object { $_.EndsWith(\"::$expected\", [StringComparison]::Ordinal) -or $_ -ceq $expected }).Count -ne 1) { throw \"Reviewed test not uniquely discovered: $expected\" }\n    }\n    $testReceipt = [ordered]@{group = $group.id; package = $group.package; filter = $group.filter; discovered_names = $names; expected_count = $group.expected.Count; status = 'DISCOVERED_NOT_RUN'}\n    $receipt.tests += $testReceipt\n    Save-Receipt\n    Invoke-Logged \"$($group.id)-test\" 'cargo' ($args + @('--', '--test-threads=1'))\n    $testOutput = Get-Content -LiteralPath (Join-Path $evidence \"$($group.id)-test.log\") -Raw\n    $summaries = @([regex]::Matches($testOutput, 'test result: ok\\. (\\d+) passed; (\\d+) failed; (\\d+) ignored;'))\n    $passed = 0\n    foreach ($summary in $summaries) {\n      $passed += [int]$summary.Groups[1].Value\n      if ([int]$summary.Groups[2].Value -ne 0 -or [int]$summary.Groups[3].Value -ne 0) { throw 'Focused tests contain failed or ignored cases' }\n    }\n    if ($passed -ne $group.expected.Count) { throw \"Focused tests did not execute all reviewed functions: $($group.id)\" }\n    $testReceipt.status = 'PASSED'\n    $testReceipt.passed = $passed\n    Save-Receipt\n  }\n  Invoke-Logged 'locked-build' 'cargo' @(\"+$toolchain\", 'build', '--locked', '-p', 'codex-cli', '--bin', 'codex', '--target', $target)\n  Assert-Paths\n  foreach ($lockPath in $lockPaths) {\n    $currentHash = (Get-FileHash -LiteralPath (Join-Path $upstream $lockPath) -Algorithm SHA256).Hash.ToLowerInvariant()\n    if ($currentHash -cne $lockHashes[$lockPath]) { throw \"Locked dependency file changed: $lockPath\" }\n  }\n  Invoke-Logged 'source-diff-check-final' 'git' @('-C', $upstream, '-c', 'core.whitespace=-blank-at-eof', 'diff', '--check')\n  $candidate = Join-Path $upstream \"codex-rs/target/$target/debug/codex.exe\"\n  if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) { throw 'Exact explicit-target debug candidate is missing' }\n  $candidateHash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()\n  Copy-Item -LiteralPath $candidate -Destination (Join-Path $evidence 'codex.exe')\n  \"$candidateHash  codex.exe\" | Set-Content -LiteralPath (Join-Path $evidence 'codex.exe.sha256') -Encoding utf8NoBOM\n  $receipt.candidate_sha256 = $candidateHash\n  $receipt.candidate_bytes = (Get-Item -LiteralPath $candidate).Length\n  $receipt.status = 'CANDIDATE_BUILT_NOT_EXECUTED'\n} catch {\n  $receipt.status = 'FAILED'\n  $receipt.failure = $_.Exception.Message\n  $_.Exception.Message | Set-Content -LiteralPath (Join-Path $evidence 'failure.log') -Encoding utf8NoBOM\n  throw\n} finally {\n  Save-Receipt\n}\n",
          "name": "Verify patch, discover tests and build without activation"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "codex-windows-policy-candidate-${{ github.run_id }}-${{ github.run_attempt }}",
