  "jobs": {
    "candidate": {
      "if": "github.event_name == 'push' && github.repository == 'ai-rtony91/Ai_Os-Forex' && github.ref == 'refs/heads/codex/windows-codex-policy-builder-20261018' && github.event.deleted == false && github.run_attempt == 1",
      "runs-on": "windows-2022",
      "timeout-minutes": 360,
      "defaults": {
